<section class="k3Section">
  <div class="k3Container">
    <div class="k3Head">
      <h2 class="k3Title">{{title}}</h2>
      <p class="k3Subtitle">{{subtitle}}</p>
    </div>
    <div class="k3Grid">{{html}}</div>
  </div>
</section>

<style>
  .k3Section {
    width: 100%;
    padding: 40px 20px;
    background: --bgcolor--;
    box-sizing: border-box;
  }

  .k3Container { max-width: --max--; margin: 0 auto; }

  .k3Head { text-align: center; margin-bottom: 28px; }
  .k3Title {
    font-size: 22px; font-weight: 700; color: --color--;
    margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .k3Subtitle { font-size: 14px; color: --color--; opacity: 0.65; margin: 0; }

  .k3Grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .k3Card {
    text-decoration: none; cursor: pointer;
    border-radius: 4px; overflow: hidden;
    transition: transform 0.25s ease;
    animation: k3In 0.35s ease both;
  }

  @keyframes k3In {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }

  .k3Card:hover { transform: translateY(-4px); }

  .k3Img {
    position: relative; aspect-ratio: 4 / 3; overflow: hidden;
    background: --bordercolor--;
  }

  .k3Img img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.4s ease;
  }
  .k3Card:hover .k3Img img { transform: scale(1.08); }

  .k3Placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    color: --color--; opacity: 0.35;
  }
  .k3Placeholder .material-symbols-outlined { font-size: 48px; }

  .k3Overlay {
    position: absolute; inset: 0;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 16px;
    background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.55) 100%);
  }

  .k3Label {
    color: #ffffff; font-size: 14px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    text-align: center;
  }

  @media (max-width: 768px) {
    .k3Grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .k3Section { padding: 28px 12px; }
    [class*="k3"] { box-sizing: border-box; max-width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    [class*="k3"], [class*="k3"] * {
      animation: none !important; transition: none !important;
    }
  }
</style>
